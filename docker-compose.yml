name: doce-encanto

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doce_encanto
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doce_encanto"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/doce_encanto
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo1234}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-pedidos@doceencanto.demo}
      MIN_LEAD_TIME_HOURS: ${MIN_LEAD_TIME_HOURS:-24}
      SLOT_CAPACITY: ${SLOT_CAPACITY:-5}
      DAYS_AHEAD: ${DAYS_AHEAD:-14}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.doce-api.rule=Host(`mvpdoce.lufedigitalwave.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.doce-api.entrypoints=websecure"
      - "traefik.http.routers.doce-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.doce-api.loadbalancer.server.port=8000"
    networks:
      - default
      - easypanel
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seeds.run &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5180:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.doce-web.rule=Host(`mvpdoce.lufedigitalwave.com.br`)"
      - "traefik.http.routers.doce-web.entrypoints=websecure"
      - "traefik.http.routers.doce-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.doce-web.loadbalancer.server.port=80"
    networks:
      - default
      - easypanel
    depends_on:
      - api

volumes:
  db_data:

networks:
  easypanel:
    external: true
